/* One stylesheet owns layout. No inherited geometry from previous studies. */
:root{font-family:'Manrope',sans-serif;color-scheme:light;--view-height:100dvh}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-size:14px;line-height:1.5;background:#f4f6fa;color:#20242c}
button,input,select,textarea{font:inherit}
button,a,input,select{touch-action:manipulation}
button{cursor:pointer;color:inherit;border:0;background:none;padding:0;transition:background-color 140ms,box-shadow 140ms}
button:disabled{cursor:default;opacity:.55}
button:active:not(:disabled){filter:brightness(.96)}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #7c9de6;outline-offset:3px}
[hidden]{display:none!important}
.app,dialog,#quick-menu{--bg:#f4f6fa;--surface:#fff;--text:#20242c;--muted:#656d7b;--line:#dbe0e8;--soft:#edf1f7;--accent:#739be7;--on:#20242c;--tint:#edf3ff;--signal:#e9f1ff;--signal-text:#20242c;--hero:#20242c;--hero-text:#fff;color:var(--text);background:var(--bg)}
.app[data-theme=terracota],dialog[data-theme=terracota],#quick-menu[data-theme=terracota]{--bg:#f8f5f2;--surface:#fffdfb;--text:#292520;--muted:#756c62;--line:#e2d9ce;--soft:#f2e9df;--accent:#d9a27f;--tint:#f9e9db;--signal:#f9e9db}
.app[data-theme=noche],dialog[data-theme=noche],#quick-menu[data-theme=noche]{color-scheme:dark;--bg:#171a20;--surface:#232831;--text:#f1f3f7;--muted:#b0b9c9;--line:#3d4654;--soft:#303a4b;--accent:#89acf2;--tint:#303d55;--signal:#303d55;--on:#171a20}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:100%;height:var(--view-height);isolation:isolate}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:72px;padding:15px max(24px,calc((100% - 1160px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700;letter-spacing:-1.4px}
.edition{font-size:9px;letter-spacing:1px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--muted);font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:12px;font-weight:600}
.workspace{min-height:0;height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scroll-padding:24px}
.page-top{max-width:1208px;margin:auto;padding:22px 24px 17px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.route-context{display:flex;align-items:center;gap:10px;flex:1}
#breadcrumb{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
#back,.icon-button{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--soft)}
.month-picker{flex-shrink:0}
.month-picker select{width:184px;font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:10px 12px;min-height:40px}
#content{max-width:1208px;margin:auto;padding:0 24px 38px;outline:none}
h1,h2,h3,p{margin:0}
h1{font-size:32px;line-height:1.18;letter-spacing:-1.1px;font-weight:600}
h2{font-size:19px;line-height:1.3;letter-spacing:-.45px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{line-height:1.55}
.sub,.muted{font-size:12px;color:var(--muted);line-height:1.5}
.page-intro{margin:9px 0 28px}
.page-intro p{margin-top:9px;max-width:580px}
.page-intro p:empty{display:none}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:32px 0 16px}
.section-head>h2{flex:1}
.link{font-size:12px;font-weight:500;min-height:40px;padding:8px 0;text-underline-offset:4px;text-align:left}
.link:hover{text-decoration:underline}
.primary,.secondary{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px;padding:11px 17px;border-radius:12px;font-size:13px;font-weight:600;text-align:center}
.primary{background:var(--text);color:var(--surface);border:1px solid var(--text)}
.secondary{background:var(--surface);border:1px solid var(--line)}
.full{width:100%}
.ico{display:inline-block;width:21px;height:21px;vertical-align:middle;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.ico path,.ico circle,.ico rect{vector-effect:non-scaling-stroke}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.between>*{overflow-wrap:anywhere}
.amount,.daily-total{font-size:32px;line-height:1.2;letter-spacing:-1px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.long-amount{font-size:clamp(21px,4.5vw,30px)!important;overflow-wrap:anywhere}
.empty{padding:28px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty p{margin:8px 0 16px;font-size:13px;color:var(--muted)}
.muted-box{background:var(--soft);padding:16px;border-radius:12px;font-size:12px;color:var(--muted);margin-top:20px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Overview: numbers and a real spending curve, followed by two working columns. */
.overview-title{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:5px 0 24px}
.overview-title p{margin-top:6px;color:var(--muted);font-size:13px}
.overview-actions{display:flex;gap:10px;flex-shrink:0}
.overview-actions .ico{width:18px;height:18px}
.summary-strip{display:grid;grid-template-columns:1.25fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:24px;overflow:hidden}
.summary-cell{padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left}
.summary-cell+.summary-cell{border-left:1px solid var(--line)}
.summary-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.summary-label .ico{width:16px;height:16px}
.summary-cell strong{font-size:29px;line-height:1.15;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.summary-cell:first-child strong{font-size:34px}
.summary-cell small{font-size:11px;color:var(--muted)}
.overview-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:24px;align-items:start}
.surface{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:23px}
.surface-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.surface-title h2{font-size:17px}
.surface-title .link{min-height:32px;padding:4px 0}
.chart-total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chart-total strong{font-size:28px;letter-spacing:-.8px;font-weight:600}
.chart-total>span{font-size:11px;color:var(--muted)}
.spending-plot{display:block;width:100%;height:auto;overflow:visible}
.spending-plot text{fill:var(--muted);font:11px 'Manrope',sans-serif}
.spending-plot .grid-line{stroke:var(--line);stroke-dasharray:3 5;stroke-width:1}
.plot-footnote{font-size:11px;color:var(--muted);margin-top:12px}
.budget-preview{margin-top:24px}
.budget-preview-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.budget-preview-head strong{font-size:27px;font-weight:600;letter-spacing:-.8px}
.budget-preview-head>span{font-size:12px;color:var(--muted)}
.budget-preview .progress{margin:18px 0 10px;height:9px}
.budget-preview .between{font-size:11px;color:var(--muted)}
.mini-budgets{margin-top:20px;border-top:1px solid var(--line)}
.mini-budget{display:grid;grid-template-columns:10px minmax(0,1fr) auto 16px;gap:10px;width:100%;text-align:left;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:12px}
.mini-budget:last-child{border-bottom:0;padding-bottom:0}
.mini-budget b{font-weight:500}.mini-budget .ico{width:15px;height:15px}
.overview-activity{margin-top:32px}
.overview-activity>.section-head{margin-top:0}
.couple-surface .people-chart{border:0;padding:0;margin:0;background:none}
.couple-surface .people-stack{margin-bottom:14px}
.couple-surface .person-comparison{grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:17px 0}
.couple-surface .person-comparison>.ico{display:none}
.couple-surface .person-comparison b{font-size:13px}
.couple-surface p{font-size:11px;color:var(--muted);margin-top:17px}
.overview-shortcut{display:flex;width:100%;align-items:center;gap:12px;margin-top:24px;text-align:left;background:var(--tint);padding:20px;border-radius:16px;border:1px solid var(--line)}
.overview-shortcut>span{flex:1}.overview-shortcut b{display:block;font-size:14px;font-weight:600}.overview-shortcut small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
.demo-note{font-size:11px;color:var(--muted);padding:22px 0 0;margin-top:24px;border-top:1px solid var(--line)}
/* Ledger: explicit day headers, real rows, amounts never occupy the label track. */
.ledger-controls{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:14px 22px;margin-bottom:14px}
.search-shell{grid-column:1/-1;position:relative}
.search-shell>.ico{position:absolute;left:15px;top:15px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.field.search{width:100%;padding:13px 16px 13px 44px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);outline-offset:2px}
.segmented{display:flex;gap:3px;padding:4px;border-radius:11px;background:var(--soft);max-width:100%}
.segmented button{flex:1;min-height:37px;padding:7px 12px;border-radius:8px;font-size:12px;text-align:center}
.segmented button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 4px #17274416;font-weight:600}
.person-filter{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}
.person-filter label{font-size:12px;color:var(--muted);flex-shrink:0}
.person-filter select{width:auto;min-width:0;flex:1;max-width:300px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:12px;min-height:42px}
.ledger-controls .person-filter{margin:0}
.ledger-count{font-size:12px;color:var(--muted);margin:8px 0 18px}
.day-group{margin-bottom:27px}
.day-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 15px;background:var(--soft);border:1px solid var(--line);border-radius:11px 11px 0 0}
.day-heading h3{font-size:12px;line-height:1.45;text-transform:capitalize}
.day-heading>div{display:flex;align-items:flex-end;flex-direction:column;gap:2px;font-size:11px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0;max-width:55%;overflow-wrap:anywhere}
.day-items{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px;overflow:hidden}
.row{display:flex;align-items:center;gap:13px;width:100%;padding:17px 16px;text-align:left;background:var(--surface);border-bottom:1px solid var(--line)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row:last-child{border-bottom:0}
.ledger-row{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(65px,auto);min-height:78px}
.row-icon{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:11px;background:var(--soft)}
.row-icon .ico{width:19px;height:19px}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-size:13px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.row-main .sub{display:block;margin-top:4px;font-size:11px;overflow-wrap:anywhere}
.money{max-width:100%;font-size:13px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.money small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.person-tag{display:inline-block;font-size:10px;background:var(--soft);padding:2px 6px;border-radius:4px;margin-top:4px}
/* Budgets and charts share the same spacing system. */
.progress{height:7px;border-radius:20px;background:var(--soft);overflow:hidden;display:block;margin:14px 0}
.progress>span{display:block;width:var(--width,0);max-width:100%;height:100%;background:var(--accent);border-radius:inherit;transition:width 250ms ease-out}
.budget-band{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:20px;padding:23px;background:var(--tint);border:1px solid var(--line);border-radius:16px}
.budget-band .amount{margin:6px 0}
.ring{width:80px;height:80px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--accent) var(--percent),var(--line) 0);position:relative;flex-shrink:0}
.ring:before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--tint)}
.ring b{position:relative;font-size:14px}
.budget-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:24px 0}
.compact-segment{width:190px}
.budget-item{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin:20px 0}
.budget-item .amount{margin:12px 0 5px}
.interactive-budget{padding:0;overflow:hidden}
.budget-open{display:block;width:100%;padding:21px 22px 15px;text-align:left}
.budget-open .amount,.budget-open>.sub{display:block}
.budget-open>.between:first-child{flex-wrap:nowrap}
.budget-open .between strong{font-size:15px;overflow-wrap:anywhere}
.budget-chevron .ico{width:16px;height:16px}
.budget-open .amount{font-size:28px}
.budget-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 22px;border-top:1px solid var(--line);background:var(--surface)}
.budget-footer>span{font-size:11px;color:var(--muted)}
.budget-footer .link{min-height:34px;font-size:11px}
.chart-surface{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.donut-layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:center;margin-bottom:20px}
.donut-visual{position:relative;width:180px;height:180px}
.donut-visual>svg{width:100%;height:100%;display:block}
.donut-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-label span{font-size:11px;color:var(--muted)}
.donut-label b{font-size:19px;letter-spacing:-.6px;font-weight:600;max-width:130px;text-align:center;overflow-wrap:anywhere}
.donut-caption strong{font-size:15px}.donut-caption p{font-size:12px;color:var(--muted);margin:7px 0}.donut-caption>span{font-size:11px;color:var(--muted)}
.chart-dot{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--accent));display:block;flex-shrink:0}
.category-line{width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) auto 15px;gap:11px;align-items:center;padding:16px 0;text-align:left;border-top:1px solid var(--line)}
.category-line-name{font-size:13px;overflow-wrap:anywhere}
.category-line-value{font-size:13px;text-align:right;overflow-wrap:anywhere}
.category-line-value small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.chart-chevron .ico{width:14px;height:14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
.stat-grid>div{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stat-grid b{display:block;font-size:25px;letter-spacing:-.7px;overflow-wrap:anywhere;margin-top:8px;font-weight:600}
.chart-unit{font-size:11px;color:var(--muted)}
.chart-peak{font-size:12px;color:var(--muted);margin:20px 0}
.chart-peak strong{font-weight:500;color:var(--text)}
.daily-chart{height:160px;display:flex;align-items:stretch;gap:3px;border-bottom:1px solid var(--line)}
.day-bar{flex:1;display:flex;align-items:flex-end;height:100%;min-width:0;padding:0 1px}
.day-bar>span{width:100%;height:var(--bar-height);background:var(--bar-color);border-radius:3px 3px 0 0;min-height:2px}
.day-bar.future{opacity:.5}
.chart-axis{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--muted)}
.day-picker{display:flex;align-items:flex-end;gap:12px;margin-top:23px}
.day-picker label{display:block;flex:1;font-size:12px;color:var(--muted)}
.day-picker select{display:block;width:100%;margin-top:7px;border:1px solid var(--line);border-radius:9px;min-height:44px;padding:9px;background:var(--surface);color:var(--text);font-size:12px}
.day-picker .secondary{white-space:nowrap}
.chart-footnote,.person-scope-note{font-size:11px;color:var(--muted);margin-top:17px;line-height:1.6}
.comparison-key{display:flex;gap:18px;margin-bottom:12px;font-size:11px;color:var(--muted)}
.comparison-key>span{display:flex;align-items:center;gap:6px}
.key-fill,.key-limit{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px}
.key-limit{background:var(--soft);border:1px solid var(--line)}
.budget-comparison{display:block;width:100%;padding:20px 0;border-bottom:1px solid var(--line);text-align:left}
.budget-comparison:last-child{border-bottom:0}
.budget-comparison .between strong{font-size:13px;font-weight:500}
.budget-comparison .between>span{font-size:12px}
.comparison-track{display:block;height:9px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0}
.comparison-track>span{display:block;height:100%;border-radius:inherit}
.over-label{display:block;margin-top:8px;font-size:11px}
.category-summary{display:flex;align-items:center;gap:16px;padding:20px 0;margin:10px 0 20px}
.category-summary .amount{margin-top:6px}
.category-symbol{display:grid;place-items:center;width:52px;height:52px;flex-shrink:0;border-radius:16px;background:var(--soft)}
.category-limit{padding:0 0 20px;border-bottom:1px solid var(--line)}
.category-limit .between{font-size:12px}
.category-limit .progress{margin:12px 0}
.daily-total{margin:20px 0}
.people-chart{margin-top:20px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:15px}
.people-stack{display:flex;overflow:hidden;height:9px;border-radius:20px;margin-bottom:10px;background:var(--soft)}
.people-stack>span{height:100%}
.person-comparison{display:grid;grid-template-columns:36px minmax(0,1fr) auto 15px;align-items:center;gap:12px;width:100%;text-align:left;padding:19px 0;border-bottom:1px solid var(--line)}
.person-comparison:last-child{border-bottom:0}
.person-avatar{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:50%;background:color-mix(in srgb,var(--person-color) 15%,var(--surface));font-size:12px;color:var(--text)}
.person-label strong{display:block;font-size:13px;font-weight:500;overflow-wrap:anywhere}
.person-label small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.person-comparison b{font-size:13px;font-weight:500;text-align:right;overflow-wrap:anywhere}
.person-comparison>.ico{width:14px;height:14px}
/* Supporting screens. */
.tools-main{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tool-row{border:1px solid var(--line);border-radius:15px;padding:23px;min-height:98px}
.tool-row .row-main b{font-size:15px}.tool-row .row-main .sub{font-size:12px}
.tool-row>.ico{width:16px;height:16px}
.settings-shortcut{display:flex;align-items:center;gap:12px;width:100%;padding:22px 0;margin-top:22px;border-top:1px solid var(--line);font-size:13px}
.settings-shortcut>.ico:last-child{margin-left:auto;width:16px}
.category-manager{background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-top:20px;overflow:hidden}
.category-manager article{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.category-manager article:last-child{border-bottom:0}
.category-manager article>button:first-child{display:flex;align-items:center;gap:12px;text-align:left;flex:1;padding:10px 0}
.category-manager strong{display:block;font-size:13px;font-weight:500;overflow-wrap:anywhere}
.category-manager small{display:block;font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.gmail-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;max-width:680px}
.gmail-mark{width:50px;height:50px;display:grid;place-items:center;background:var(--soft);border-radius:15px;margin-bottom:20px}
.gmail-card p{margin:12px 0 22px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.gmail-connect{display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 16px;min-height:48px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--surface);font-weight:500;font-size:13px}
.gmail-connect svg{flex-shrink:0}
.gmail-feedback{font-size:11px;color:var(--muted);margin-top:16px;overflow-wrap:anywhere}
.connection-scope{max-width:680px;padding:20px 0;margin-top:12px;border-bottom:1px solid var(--line)}
.connection-scope strong{font-size:13px;font-weight:500}
.connection-scope p{font-size:12px;color:var(--muted);margin:8px 0 12px}
.connection-scope a{font-size:12px}.connection-scope .ico{width:14px;height:14px}
.palette-options{display:grid;gap:10px;margin:18px 0}
.page-intro~h2+.segmented{margin:16px 0 24px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.swatches button{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:10px 15px;display:flex;align-items:center;gap:8px}
.swatches i{width:13px;height:13px;border-radius:50%;display:block}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--text)}
.pill{font-size:11px;padding:4px 8px;background:var(--soft);border-radius:6px}
/* Navigation is a non-scrolling row; no fixed button competes with content. */
.bottom{display:flex;align-items:center;justify-content:center;gap:12px;min-height:86px;padding:10px 20px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);z-index:5}
.bottom nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex:0 1 460px}
.bottom nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:57px;width:100%;padding:6px 4px;border-radius:12px;font-size:11px;color:var(--muted)}
.bottom nav button[aria-current=page]{background:var(--tint);color:var(--text);font-weight:600}
.bottom nav .ico{width:21px;height:21px}
#nav-indicator{display:none}
#add{display:grid;place-items:center;width:52px;height:52px;flex-shrink:0;border-radius:17px;background:var(--tint);border:1px solid var(--line);color:var(--text)}
#add .ico{transition:transform 200ms ease-out}
.quick-open #add .ico{transform:rotate(45deg)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;max-width:min(500px,calc(100vw - 32px));width:max-content;background:var(--text);color:var(--surface);box-shadow:0 8px 35px #15264425;border-radius:13px;font-size:12px;z-index:8}
.toast button{font-size:12px;text-decoration:underline;min-height:30px}
/* Dialog header, scroll body and discard confirmation occupy separate rows. */
dialog{position:fixed;inset:0;margin:auto;border:1px solid var(--line);padding:0;border-radius:22px;box-shadow:0 24px 100px #17253a35;font-family:'Manrope',sans-serif;background:var(--surface);overflow:hidden}
dialog::backdrop{background:#14203350;backdrop-filter:blur(3px)}
#sheet{width:min(480px,calc(100vw - 24px));max-height:calc(var(--view-height) - 32px)}
#sheet[open]{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.sheet-handle,.grab-area{height:24px;display:flex;align-items:center;justify-content:center;cursor:grab}
.sheet-handle:after,.grab-area>span{content:'';display:block;width:35px;height:4px;border-radius:4px;background:var(--line)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:22px;flex:1;overflow-wrap:anywhere}
#close-sheet{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:var(--soft);flex-shrink:0}
#sheet-body{overflow:auto;overscroll-behavior:contain;min-height:0;scrollbar-width:thin;padding:22px 24px}
form label{display:block;font-size:12px;font-weight:500;margin:17px 0 7px}
form label:first-child{margin-top:0}
form input,form select{display:block;width:100%;min-height:45px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px}
form input:focus,form select:focus{outline:2px solid var(--accent);outline-offset:1px}
form input[type=checkbox]{display:inline-block;vertical-align:middle;width:18px;height:18px;min-height:0;margin-right:8px;padding:0}
form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.amount-currency{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:18px;align-items:end;padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.amount-currency label{margin:0 0 8px}
.amount-currency .amount-input{font-size:40px;line-height:1.2;letter-spacing:-1px;border:0;padding:0;min-height:50px;background:none}
.amount-currency select{padding:10px 7px;font-size:14px;background:var(--soft)}
.amount-currency input::-webkit-inner-spin-button{appearance:none}
.entry-types{margin:0 0 23px}
.person-field p{font-size:11px;color:var(--muted);margin-top:7px}
.inline-category{margin-top:10px}
.inline-category summary{font-size:12px;cursor:pointer;min-height:30px}
.inline-category>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:10px}
.inline-category .secondary{padding-inline:13px}

function balance(a){return transactions.reduce((s,t)=>{if(t.type==='transfer')return s+(t.to===a.id?t.received:0)-(t.account===a.id?t.native:0);return s+(t.account===a.id?(t.type==='income'?t.native:-t.native):0);},a.opening);}
const accountName=id=>accounts.find(a=>a.id===id)?.name||'Sin cuenta';
const shortDate=date=>{const [y,m,d]=date.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-DO',{day:'numeric',month:'short'});};
const sorted=()=>currentTx().slice().sort((a,b)=>b.date.localeCompare(a.date));
function toast(text,undo){clearTimeout(toastTimer);$('.toast span').textContent=text;$('.toast').hidden=false;$('#undo').hidden=!undo;$('#undo').onclick=()=>{undo();render();$('.toast').hidden=true;};toastTimer=setTimeout(()=>$('.toast').hidden=true,6500);}
function openSheet(title,html){sheetSaved=false;sheetBaseline=null;$('#discard-prompt').hidden=true;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=html;$('#sheet').dataset.theme=resolveTheme();if(!$('#sheet').open){sheetReturnFocus=document.activeElement;$('#sheet').showModal();}decorate();}
function closeSheet(){if(!$('#sheet').open)return;const changed=sheetBaseline!==null&&$('#form')&&formSignature()!==sheetBaseline;if(changed&&!sheetSaved){$('#discard-prompt').hidden=false;$('#keep-editing').focus();return;}finishClose();}
function form(html,onSave,button='Guardar'){openSheet($('#sheet-title').textContent,`<form id="form">${html}<div class="form-error" role="alert" hidden></div><div class="form-actions"><button type="button" class="secondary" data-action="close">Cancelar</button><button class="primary" type="submit">${button}</button></div></form>`);$('#form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.currentTarget));try{sheetSaved=true;onSave(values);}catch(error){sheetSaved=false;$('.form-error').textContent=error.message;$('.form-error').hidden=false;}};sheetBaseline=formSignature();queueMicrotask(()=>{const input=$('#form input:not([type=hidden])');if(input)input.focus({preventScroll:true});});}
function positive(v){const n=Number(v);if(!Number.isFinite(n)||n<=0||n>1e9)throw Error('Escribe un monto mayor que cero y menor que 1,000 millones.');return cents(n);}
function convertCents(amount,rate){const converted=Math.round(amount*rate);if(!Number.isSafeInteger(converted)||converted<1)throw Error('La conversión queda fuera del rango permitido. Revisa el monto y la tasa.');return converted;}
function field(label,name,value='',type='text',attrs=''){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}>`;}
const options=(values,current)=>values.map(v=>{const [value,label]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(label)}</option>`;}).join('');
function select(label,name,values,current){return `<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options(values,current)}</select>`;}
function empty(title,text,action,label){return `<div class="empty"><h3>${title}</h3><p>${text}</p>${action?`<button class="primary" data-action="${action}">${label}</button>`:''}</div>`;}

function section(title,target,label='Ver todo'){return `<div class="section-head"><h2>${title}</h2>${target?`<button class="link" data-route="${target}">${label} →</button>`:''}</div>`;}
function row(t){return `<button class="row" data-action="edit-tx" data-id="${t.id}"><span class="row-icon" aria-hidden="true">${icon(t.type==='income'?'income':t.type==='transfer'?'transfer':categoryIcon(t.category))}</span><span class="row-main"><b>${esc(t.name)}</b><span class="sub">${esc(shortDate(t.date))}${month!=='2026-09'?' · '+esc(t.date):''} · ${esc(accountName(t.account))}</span>${t.type==='expense'?`<span class="person-tag">${esc(personName(personOf(t)))}</span>`:''}</span><span class="money">${t.type==='income'?'+ ':t.type==='expense'?'− ':''}${money(t.native,t.currency)}${t.currency!=='DOP'?`<small>${money(t.dop)}</small>`:''}${t.type==='transfer'?'<small>Transferencia interna</small>':''}</span></button>`;}

function homeView(){const t=totals(),credit=accounts.find(a=>a.type==='credit'&&balance(a)<0);return `${heading('Tu mes, en perspectiva.','Ingresos, compromisos y espacio para tus planes.')}<div class="hero"><div class="eyebrow">Balance del mes</div><div class="amount">${money(t.available)}</div><div class="sub">Ingresos menos gastos registrados</div><div class="hero-metrics"><div><span class="label">Ingresos</span><b>${money(t.income)}</b></div><div><span class="label">Gastos</span><b>${money(t.spend)}</b></div></div></div><div class="quick"><button data-action="expense"><span>↗</span>Gasto</button><button data-action="income"><span>↙</span>Ingreso</button><button data-action="transfer"><span>⇄</span>Transferir</button></div><div class="budget-band"><div><div class="eyebrow">Tu margen en el presupuesto</div><div class="amount">${money(t.remaining)}</div><div class="sub">${t.remaining>=0?'Restantes':'Sobre el límite'} · ${money(t.limit)} planificados</div><button class="link" data-route="plan">Revisar categorías →</button></div><div class="ring" style="--percent:${Math.min(100,t.limit?t.spend/t.limit*100:0)}%"><b>${t.limit?Math.round(t.spend/t.limit*100):0}%</b></div></div>${credit&&month==='2026-09'?`<div class="signal"><div class="badge">SEP<b>${credit.due}</b></div><div><strong>${esc(credit.name)}</strong><p>Próximo pago · ${money(-balance(credit),credit.currency)}</p></div><button data-route="payments" aria-label="Ver próximos pagos">→</button></div>`:''}${section('Tus cuentas','accounts')}<div class="accounts-strip">${accounts.filter(a=>['bank','card'].includes(a.id)).map(accountCard).join('')}</div>${section('Últimos movimientos','transactions')}<div class="rows">${sorted().slice(0,3).map(row).join('')||empty('Mes sin movimientos','Registra un ingreso o gasto para comenzar.','income','Agregar ingreso')}</div>${section('Un paso más cerca','goals')}${goals.slice(0,1).map(g=>`<div class="goal-preview"><div class="between"><b>${esc(g.name)}</b><span class="sub">${Math.round(g.saved/g.target*100)}%</span></div><div class="progress"><span style="--width:${Math.min(100,g.saved/g.target*100)}%"></span></div><div class="between sub"><span>${money(g.saved)}</span><span>Meta ${money(g.target)}</span></div></div>`).join('')}`;}

function dailyChart(){const list=expenseRows(),days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate(),daily=Array.from({length:days},(_,i)=>({date:month+'-'+String(i+1).padStart(2,'0'),total:0}));list.forEach(t=>{const i=Number(t.date.slice(8))-1;if(daily[i])daily[i].total+=t.dop;});const total=daily.reduce((s,d)=>s+d.total,0);if(!total)return empty('Sin actividad en este mes','Los días con gastos aparecerán aquí.');const latest=list.reduce((n,t)=>Math.max(n,Number(t.date.slice(8))),1),lastDay=month===today.slice(0,7)?Math.max(Number(today.slice(8)),latest):days,max=Math.max(...daily.map(d=>d.total),1);return `<div class="chart-surface"><div class="between"><div><strong>Gastos día a día</strong><p class="sub">${periodLabel()} · Toca una barra</p></div><span class="chart-unit">RD$</span></div><p class="chart-peak">Mayor gasto diario <strong>${money(max)}</strong></p><div class="daily-chart" aria-label="Gastos diarios en RD$">${daily.map((d,i)=>`<button class="day-bar ${i+1>lastDay?'future':''}" data-action="open-day" data-id="${d.date}" aria-label="Ver ${shortDate(d.date)}: ${money(d.total)}" style="--bar-height:${Math.max(2,d.total/max*100)}%;--bar-color:${d.total?'var(--accent)':'var(--line)'}"><span></span></button>`).join('')}</div><div class="chart-axis"><span>1</span><span>${Math.round(days/2)}</span><span>${days}</span></div><div class="day-picker"><label for="chart-day">Explorar un día<select id="chart-day">${daily.map((d,i)=>`<option value="${d.date}" ${i+1===lastDay?'selected':''}>${shortDate(d.date)} · ${money(d.total)}</option>`).join('')}</select></label><button class="secondary" data-action="selected-day">Ver gastos</button></div><div class="chart-footnote">${month===today.slice(0,7)?'Datos registrados hasta el '+lastDay+' de este mes.':'Cada barra corresponde a los gastos registrados de ese día.'}</div></div>`;}

  if(Array.isArray(st.incomeTypes)&&st.incomeTypes.length)incomeTypes.splice(0,incomeTypes.length,...st.incomeTypes);

  (st.people||[]).forEach(sp=>{const p=people.find(p=>p.id===sp.id);if(p&&typeof sp.name==='string'&&sp.name.trim())p.name=sp.name;});
  Object.keys(personalLimits).forEach(k=>delete personalLimits[k]);Object.assign(personalLimits,st.personalLimits||{});
  Object.assign(typeBudgetMap,st.typeBudgetMap||{});
  if(!categories.includes(selectedCategory))selectedCategory=categories[0];
  return true;}
 const renderBeforeState=render;
 render=function(){renderBeforeState();saveState();};
 addEventListener('pagehide',saveState);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveState();});
 actions['reset-state']=()=>{if(!confirm('¿Volver a los datos de ejemplo? Se borran tus movimientos, presupuestos, tipos y ajustes guardados en este dispositivo.'))return;resetting=true;try{localStorage.removeItem(STATE_KEY);}catch{}location.reload();};

 /* --- formulario de gasto: tipo como desplegable que arrastra al presupuesto, con memoria --- */
 const formBeforeLearn=form;
 form=function(html,onSave,button){
  const ctx={};
  formBeforeLearn(html,v=>{preSave(v,ctx);onSave(v);postSave(v,ctx);},button);
  ctx.title=$('#sheet-title').textContent;ctx.oldName=$('#f-name')?.value;
 };
 function preSave(v,ctx){
  if(!('budget_assignment' in v)||!v.category)return;
  const chosen=v.budget_assignment;if(chosen==='auto')return;
  const want=chosen===''?null:chosen,resolved=resolveBudgetId(v.category);
  if(want===resolved){v.budget_assignment='auto';return;}
  if(v.remember_budget==='on'){typeBudgetMap[v.category]=want??'none';v.budget_assignment='auto';ctx.learned={type:v.category,name:want?budgetById(want)?.category:null};}
 }
 function postSave(v,ctx){
  if(ctx.title==='Editar categoría'&&ctx.oldName&&v.name){const nn=v.name.trim().replace(/\s+/g,' ');if(nn!==ctx.oldName&&Object.hasOwn(typeBudgetMap,ctx.oldName)){typeBudgetMap[nn]=typeBudgetMap[ctx.oldName];delete typeBudgetMap[ctx.oldName];}}
  if(ctx.learned){toast('Guardado. Desde ahora «'+ctx.learned.type+'» va a '+(ctx.learned.name?'«'+ctx.learned.name+'»':'ningún presupuesto')+'.');}
  saveState();
 }
 const transactionBeforeLearn=transactionForm;
 transactionForm=function(type,id,draft){
  transactionBeforeLearn(type,id,draft);
  const cat=$('#f-category');if(!cat)return;
  $('.category-choices')?.remove();cat.hidden=false;
  const assign=$('#f-budget_assignment');if(!assign)return;
  const preview=$('#assignment-preview');
  preview.insertAdjacentHTML('afterend','<label class="remember-budget" id="remember-wrap" hidden><input type="checkbox" name="remember_budget"><span id="remember-text"></span></label>');
  const wrap=$('#remember-wrap'),box=wrap.querySelector('input'),text=$('#remember-text');
  const refresh=()=>{
   const type=cat.value,rid=resolveBudgetId(type),rname=rid?budgetById(rid).category:null;
   const auto=[...assign.options].find(o=>o.value==='auto');if(auto)auto.textContent='Según el tipo · '+(rname||'sin presupuesto');
   const value=assign.value,b=value==='auto'?(rid?budgetById(rid):null):(value?budgetById(value):null);
   preview.textContent=b?'Irá a '+b.category+' · '+money(Math.max(0,b.limit-budgetSpend(b)))+' disponibles ahora.':'Quedará sin presupuesto.';
   const want=value==='auto'?rid:(value||null);
   const differs=value!=='auto'&&want!==rid;
   wrap.hidden=!differs;box.checked=differs;
   if(differs)text.innerHTML='Recordar: los gastos de <b>'+esc(type)+'</b> irán siempre a <b>'+esc(b?b.category:'ningún presupuesto')+'</b>. Desmarca para que sea solo este gasto.';
  };
  cat.addEventListener('change',()=>{assign.value='auto';refresh();});
  assign.addEventListener('change',refresh);
  refresh();
  sheetBaseline=formSignature();
 };

 /* --- ajustes: mapa editable + restablecer --- */
 const typeMapSection=()=>{
  const types=categories.filter(c=>!archivedExpenseTypes.has(c));
  const opts=type=>{const rid=resolveBudgetId(type);return [...budgets.map(b=>[b.id,b.category]),['none','Sin presupuesto']].map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(rid??'none')?'selected':''}>${esc(l)}</option>`).join('');};
  return `<h2 class="settings-h2">A qué presupuesto va cada tipo de gasto</h2><p class="sub settings-note">Se aprende solo cuando cambias el presupuesto de un gasto y lo marcas como «recordar». Aquí lo corriges cuando quieras.</p><div class="rows type-map">${types.map(t=>{const n=expenseRows(t).length,learned=Object.hasOwn(typeBudgetMap,t);return `<div class="row type-map-row"><span class="row-main"><b>${esc(t)}</b><span class="sub">${n} ${n===1?'gasto':'gastos'} este mes · ${learned?'aprendido':'por nombre'}</span></span><select data-type-map="${esc(t)}" aria-label="Presupuesto para ${esc(t)}">${opts(t)}</select></div>`;}).join('')}</div>`;
 };
 const settingsBeforeLearn=views.settings;
 views.settings=()=>settingsBeforeLearn()
  .replace('</div><h2>Elige tu ambiente</h2>','</div>'+typeMapSection()+'<h2>Elige tu ambiente</h2>')
  .replace('<div class="muted-box">',`<div class="rows settings-rows"><button class="row settings-row" data-action="reset-state"><span class="row-main"><b>Restablecer datos de ejemplo</b><span class="sub">Borra tus movimientos y ajustes de este dispositivo</span></span>${icon('close')}</button></div><div class="muted-box">`);
 document.addEventListener('change',e=>{const sel=e.target.closest('select[data-type-map]');if(!sel)return;const type=sel.dataset.typeMap,v=sel.value;const byName=budgets.find(b=>b.category===type)?.id;if(v===byName)delete typeBudgetMap[type];else typeBudgetMap[type]=v;saveState();render();toast('Los gastos de «'+type+'» van a '+(v==='none'?'ningún presupuesto':'«'+budgetById(v)?.category+'»')+'.');});

 /* --- arranque --- */
 const restored=loadState();
 if(!restored){people[0].name='Jorge';people[1].name='Heiry';}
 render();
})();
</script></body></html>
